[project]
name = "code-review-multiagent"
version = "2.0.0"
description = "多 Agent 代码审查平台 - 规则引擎 + LLM 并行审查"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.9",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.9.0",
    "anthropic>=0.52.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_multiagent"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "E741",
    "E402",
    "B007",
    "B008",
    "B009",
    "B904",
    "UP035",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["code_review_multiagent"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["anthropic.*", "chromadb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
